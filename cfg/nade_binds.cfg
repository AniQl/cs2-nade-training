// ============================================================
// CS2 Grenade Training - default binds and shortcuts
// No numpad required.
// Personal changes belong in nade_user.cfg so updates do not
// overwrite them.
// ============================================================

// Map shortcuts (available after exec nade or any nade_<map>)
alias nade_ancient "exec nade_ancient"
alias nade_anubis "exec nade_anubis"
alias nade_cache "exec nade_cache"
alias nade_dust2 "exec nade_dust2"
alias nade_inferno "exec nade_inferno"
alias nade_mirage "exec nade_mirage"
alias nade_nuke "exec nade_nuke"
alias nade_help "exec nade_help"
alias nade_off "exec nade_off"

// Rethrow the last grenade
bind "MOUSE4" "sv_rethrow_last_grenade"

// Full utility + armor
bind "MOUSE5" "give weapon_flashbang; give weapon_hegrenade; give weapon_smokegrenade; give weapon_molotov; give weapon_incgrenade; give weapon_decoy; give item_assaultsuit"

// Clear smoke, fire, projectiles and decals
bind "DEL" "cl_removedecals; ent_fire smokegrenade_projectile kill; ent_fire inferno kill; ent_fire molotov_groundfire kill; ent_fire molotov_projectile kill; ent_fire flashbang_projectile kill; ent_fire hegrenade_projectile kill"

// Grenade trajectory and landing preview
bind "PGUP" "cl_sim_grenade_trajectory 1; sv_grenade_trajectory_prac_pipreview 1; sv_grenade_trajectory_prac_trailtime 8; echo [nade] trajectory ON"
bind "PGDN" "cl_sim_grenade_trajectory 0; sv_grenade_trajectory_prac_pipreview 0; sv_grenade_trajectory_prac_trailtime 0; echo [nade] trajectory OFF"

// Round reset and diagnostics
bind "INS" "mp_restartgame 1"
bind "HOME" "toggle sv_showimpacts 0 1"
bind "END" "toggle cl_showpos 0 1"

// Reload the complete setup
bind "F9" "exec nade"

echo "[nade] binds loaded: MOUSE4=rethrow MOUSE5=utility DEL=clear PGUP/PGDN=trajectory INS=restart HOME=impacts END=showpos F9=reload"
