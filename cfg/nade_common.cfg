// ============================================================
// CS2 Grenade Training - shared practice settings
// Loaded by nade.cfg and every nade_<map>.cfg
// Local/listen practice server only.
// ============================================================

sv_cheats 1

// Round and win conditions
mp_limitteams 0
mp_autoteambalance 0
mp_ignore_round_win_conditions 1
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_freezetime 0
mp_warmup_end
mp_team_intro_time 0

// Economy and buying
mp_maxmoney 60000
mp_startmoney 60000
mp_afterroundmoney 60000
mp_buytime 9999
mp_buy_anywhere 1
mp_free_armor 2

// Respawn, ammo and utility
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
sv_infinite_ammo 1
ammo_grenade_limit_total 5
mp_ct_default_grenades "weapon_flashbang weapon_hegrenade weapon_smokegrenade weapon_incgrenade weapon_decoy"
mp_t_default_grenades "weapon_flashbang weapon_hegrenade weapon_smokegrenade weapon_molotov weapon_decoy"

// Grenade and aim feedback
sv_grenade_trajectory_prac_pipreview 1
sv_grenade_trajectory_prac_trailtime 8
sv_grenade_trajectory_time_spectator 8
cl_sim_grenade_trajectory 1
sv_showimpacts 1
sv_showimpacts_time 8
cl_showpos 0

// Clean server and skip intro
bot_kick
bot_quota 0
cl_versus_intro 0
