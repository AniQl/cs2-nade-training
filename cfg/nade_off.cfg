// ============================================================
// CS2 Grenade Training - disable binds and visuals
// Usage: exec nade_off
// ============================================================

echo "[nade] disabling training binds and visuals..."
bind "DEL" "sellbackall"
unbind "PGUP"
unbind "PGDN"
unbind "INS"
unbind "HOME"
unbind "END"
unbind "F9"
unbind "MOUSE4"
unbind "MOUSE5"
cl_sim_grenade_trajectory 0
sv_grenade_trajectory_prac_pipreview 0
sv_grenade_trajectory_prac_trailtime 0
sv_grenade_trajectory_time_spectator 0
sv_showimpacts 0
cl_showpos 0
sv_cheats 0
echo "[nade] off. DEL restored to sellbackall."
echo "[nade] Binds added in nade_user.cfg are not removed automatically."
