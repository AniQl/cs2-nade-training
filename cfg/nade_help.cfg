echo " Shortcuts after exec nade: nade_ancient ... nade_nuke"
echo " Generic setup on the current map: exec nade"
echo " Disable binds and visuals: exec nade_off"
echo " Personal overrides: edit nade_user.cfg"
echo "----------------------------------------------"
echo " Binds:"
echo "   MOUSE4  rethrow last grenade"
echo "   MOUSE5  give full utility + armor"
echo "   DEL     clear smoke, fire, projectiles, decals"
echo "   PGUP    grenade trajectory and preview ON"
echo "   PGDN    grenade trajectory and preview OFF"
echo "   INS     restart round"
echo "   HOME    toggle bullet impacts"
echo "   END     toggle position/angle display (off by default)"
echo "   F9      reload exec nade"
echo "----------------------------------------------"
